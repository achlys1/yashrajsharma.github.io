<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashraj Sharma | The Artist & Architect</title>
    
    <!-- Fonts: Cinzel for an artistic, classic feel, Plus Jakarta for readability -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    
    <style>
        :root {
            --vg-blue: #0A1128;
            --vg-dark-blue: #030712;
            --vg-gold: #FFD700;
            --vg-light-gold: #FBE17D;
        }
        
        body {
            background-color: var(--vg-dark-blue);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        h1, h2, h3, .art-font {
            font-family: 'Cinzel', serif;
        }

        /* Starry Night Canvas Background */
        #starry-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        /* Refined Glassmorphism for readability */
        .glass {
            background: rgba(10, 17, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .gold-border:hover {
            border-color: var(--vg-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }

        .gradient-text-gold {
            background: linear-gradient(to right, #FFD700, #FBE17D, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input, textarea {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--vg-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Chat Widget Styles */
        #chat-widget {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            transform: translateY(150%);
            opacity: 0;
        }
        #chat-widget.active {
            transform: translateY(0);
            opacity: 1;
        }
        .bot-msg { background: rgba(255, 215, 0, 0.05); border-left: 2px solid var(--vg-gold); }
        .user-msg { background: rgba(255, 255, 255, 0.05); border-right: 2px solid #fff; text-align: right; }

        /* Founder Portrait Styling */
        .portrait-frame {
            position: relative;
            border-radius: 9999px;
            padding: 6px;
            background: conic-gradient(from 180deg, #FFD700, #FBE17D, #FFA500, #FFD700);
            animation: spin-slow 12s linear infinite;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.25);
        }
        .portrait-frame img {
            border-radius: 9999px;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #030712;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .founder-signature {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.15em;
        }
    </style>
</head>
